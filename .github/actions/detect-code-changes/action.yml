name: 'Detect code changes'
description: >
  Diffs the current push/PR against its base branch and reports whether any changed file could
  affect lint/typecheck/test/build/e2e outcomes. Shared by ci.yml and playwright.yml so both
  workflows skip the full suite on the same set of no-op changes (docs, the generated photo
  manifest, .gitignore, etc.) without maintaining two copies of the exemption list.

outputs:
  code:
    description: >
      'true' if any changed file is NOT covered by the exemption list below (so the full suite
      should run); 'false' if every changed file is exempt (so downstream jobs can skip).
    value: ${{ steps.filter.outputs.code }}

runs:
  using: 'composite'
  steps:
    - name: Detect non-doc changes
      id: filter
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          DIFF_FROM=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
        else
          DIFF_FROM="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "$DIFF_FROM" ] || [ "$DIFF_FROM" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit to diff against - running full suite to be safe."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        FILES=$(git diff --name-only "$DIFF_FROM" "$HEAD_SHA")
        echo "Changed files:"
        echo "$FILES"

        # ---------------------------------------------------------------------------------------
        # EXEMPT_PATTERN: files/folders that can be changed WITHOUT affecting the outcome of
        # lint/typecheck/test/build/e2e. If every changed file matches this pattern, `code`
        # is set to 'false' and ci.yml/playwright.yml skip their real jobs (they still report
        # "success" with steps skipped, so required PR status checks are satisfied - see the
        # "CI" section of CLAUDE.md for why that matters).
        #
        # This is an ERE (extended regex) passed to `grep -vE`, so each alternative is checked
        # against the full relative path of a changed file, and a file is exempt if it matches
        # ANY alternative. To add a new exemption:
        #
        #   - A single file, matched exactly:       ^path/to/file\.ext$
        #   - Every file under a folder:             ^path/to/folder/
        #   - Every file with a given extension:     \.ext$   (careful: this applies repo-wide,
        #                                             not just in one folder - prefer anchoring
        #                                             to a folder if you only mean it there)
        #
        # Remember to escape literal dots as \. (an unescaped `.` matches any character), and to
        # join alternatives with `|`. Test a candidate pattern locally before relying on it, e.g.:
        #
        #   echo "some/changed/file.txt" | grep -vE 'your-new-pattern-here'
        #
        # (prints the line if it's NOT exempt, prints nothing if it IS exempt).
        #
        # Current exemptions:
        #   \.md$ / \.MD$                                  - any Markdown doc, anywhere
        #   ^reference/                                    - the reference/ doc tree
        #   ^public/spurs-women/photo-gallery\.manifest\.json$  - the generated photo manifest
        #                                                    (validated separately, unconditionally,
        #                                                    by validate-manifest.yml)
        #   ^\.gitignore$                                   - .gitignore has no effect on
        #                                                    already-tracked files, so editing it
        #                                                    alone can't change any CI outcome
        # ---------------------------------------------------------------------------------------
        EXEMPT_PATTERN='\.md$|\.MD$|^reference/|^public/spurs-women/photo-gallery\.manifest\.json$|^\.gitignore$'

        if echo "$FILES" | grep -vE "$EXEMPT_PATTERN" | grep -q .; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi
