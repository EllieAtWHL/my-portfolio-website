name: Validate Photo Manifest

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/generate-external-manifest.js'
      - 'scripts/validate-manifest.js'
      - 'public/spurs-women/photo-gallery.manifest.json'
      - '.github/workflows/validate-manifest.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/generate-external-manifest.js'
      - 'scripts/validate-manifest.js'
      - 'public/spurs-women/photo-gallery.manifest.json'
      - '.github/workflows/validate-manifest.yml'

jobs:
  validate-manifest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate photo manifest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EXTERNAL_REPO_OWNER: ${{ secrets.EXTERNAL_REPO_OWNER || 'EllieAtWHL' }}
        EXTERNAL_REPO_NAME: ${{ secrets.EXTERNAL_REPO_NAME || 'spurs-women-photo-gallery' }}
        CDN_PROVIDER: jsdelivr
        CDN_BASE_URL: https://cdn.jsdelivr.net
      run: |
        npm run generate-external-manifest

    - name: Validate photo manifest
      run: |
        npm run validate-manifest

    - name: Upload manifest as artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: photo-manifest
        path: public/spurs-women/photo-gallery.manifest.json
        retention-days: 30
