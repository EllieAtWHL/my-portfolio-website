name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Detect non-doc changes
      id: filter
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          DIFF_FROM=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
        else
          DIFF_FROM="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "$DIFF_FROM" ] || [ "$DIFF_FROM" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit to diff against - running full suite to be safe."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        FILES=$(git diff --name-only "$DIFF_FROM" "$HEAD_SHA")
        echo "Changed files:"
        echo "$FILES"

        if echo "$FILES" | grep -vE '\.md$|\.MD$|^reference/' | grep -q .; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi

  playwright:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: playwright (${{ matrix.browser }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browser (${{ matrix.browser }})
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run Playwright tests
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      run: npx playwright test --project=${{ matrix.browser }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30
