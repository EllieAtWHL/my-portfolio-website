<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>You're offline - EllieAtWHL</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f0f9f0;
    --text: #0a1f0a;
    --accent: #2f7a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1f0a;
      --text: #f0f9f0;
      --accent: #86efac;
    }
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main {
    max-width: 28rem;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.75rem;
  }
  p {
    line-height: 1.5;
    margin-bottom: 1.5rem;
  }
  button {
    font: inherit;
    padding: 0.6rem 1.5rem;
    border-radius: 0.5rem;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
  }
  button:hover {
    background: var(--accent);
    color: var(--bg);
  }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This page isn't available without an internet connection. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try Again</button>
</main>
</body>
</html>
